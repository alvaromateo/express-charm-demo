# This file configures Charmcraft.
# See https://juju.is/docs/sdk/charmcraft-config for guidance.

name: demo-app

type: charm

base: ubuntu@24.04

# the platforms this charm should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
  amd64:
  arm64:
  # ppc64el:
  # s390x:

# (Required)
summary: A very short one-line summary of the Demo application.

# (Required)
description: |
  A comprehensive overview of your Demo application.

# the charm extends the ExpressJS base class because the ingress uses the port
# set by the charm in the relation
extensions:
  - flask-framework

requires:
  ingress-frontend:
    interface: ingress
    limit: 1

# containers:
#   expressjs-app:
#     resource: flask-app-image
#   flask-app:
#     resource: flask-app-image

config:
  options:
    frontend-port:
      default: 3010
      description: >-
        Port for the frontend service (expressjs)
      type: int
